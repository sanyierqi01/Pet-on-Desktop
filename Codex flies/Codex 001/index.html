<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="task-panel" aria-label="To do list">
        <header class="topbar">
          <div>
            <p class="eyebrow">Today</p>
            <h1>To Do List</h1>
          </div>
          <div class="progress" aria-live="polite">
            <span id="doneCount">0</span>/<span id="totalCount">0</span>
          </div>
        </header>

        <form class="task-form" id="taskForm">
          <label class="sr-only" for="taskInput">New task</label>
          <input
            id="taskInput"
            type="text"
            autocomplete="off"
            maxlength="80"
            placeholder="Add a task..."
          />
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <div class="filters" role="tablist" aria-label="Task filters">
          <button class="filter active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="done">Done</button>
        </div>

        <ul class="task-list" id="taskList" aria-label="Tasks"></ul>

        <footer class="footer">
          <span id="remainingText">No tasks yet</span>
          <button class="clear-btn" id="clearDone" type="button">Clear done</button>
        </footer>
      </section>
    </main>

    <template id="taskTemplate">
      <li class="task-item">
        <label class="check-wrap">
          <input class="task-check" type="checkbox" />
          <span class="custom-check" aria-hidden="true"></span>
          <span class="task-title"></span>
        </label>
        <button class="delete-btn" type="button" aria-label="Delete task">&times;</button>
      </li>
    </template>

    <script src="./script.js"></script>
  </body>
</html>

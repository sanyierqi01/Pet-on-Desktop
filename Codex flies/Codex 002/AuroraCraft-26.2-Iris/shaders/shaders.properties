name=AuroraCraft 26.2 Iris LOADTEST
author=Codex
description=Iris/Fabric load-test build. If enabled correctly, the whole scene becomes visibly stylized.

oldLighting=false
underwaterOverlay=false
sun=true
moon=true
vignette=false
separateAo=true
clouds=off

shadowMapResolution=3072
shadowDistance=128.0
shadowIntervalSize=4.0
shadowHardwareFiltering=true
shadowtex0Mipmap=false
shadowtex0Nearest=false

alphaTest.gbuffers_terrain=GREATER 0.1
alphaTest.gbuffers_entities=GREATER 0.1
alphaTest.gbuffers_textured=GREATER 0.1
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

screen=<profile>
profile.LOW=shadowMapResolution=1024 shadowDistance=64.0
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=96.0
profile.HIGH=shadowMapResolution=3072 shadowDistance=128.0
